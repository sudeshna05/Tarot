<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free Tarot Reading Online | AUREN</title>
  <meta name="description" content="A free online tarot reading — no login, no cost, no tracking. Choose your question, select a spread, pull your cards, and reflect on what the tarot reveals.">

  <!-- Open Graph -->
  <meta property="og:title" content="Free Tarot Reading Online | AUREN">
  <meta property="og:description" content="A free online tarot reading experience. No login required. Choose a spread, pull your cards, and reflect.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://YOUR-FINAL-DOMAIN/">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Free Tarot Reading Online | AUREN">
  <meta name="twitter:description" content="A free online tarot reading experience. No login required.">

  <!-- Canonical -->
  <!-- TODO: Replace YOUR-FINAL-DOMAIN with your actual domain before deployment -->
  <link rel="canonical" href="https://YOUR-FINAL-DOMAIN/">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

  <link rel="stylesheet" href="style.css">

  <!-- Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "AUREN",
    "description": "A free online tarot reading experience. Choose your question, select a spread, pull your cards, and reflect.",
    "url": "https://YOUR-FINAL-DOMAIN/",
    "potentialAction": {
      "@type": "SearchAction",
      "target": "https://YOUR-FINAL-DOMAIN/?q={search_term_string}",
      "query-input": "required name=search_term_string"
    }
  }
  </script>
</head>
<body>

<noscript>
  <div class="noscript-msg">
    <h1>AUREN</h1>
    <p>This experience requires JavaScript to be enabled. Please enable JavaScript in your browser settings and reload the page.</p>
  </div>
</noscript>

<div id="app-shell">

  <!-- Star field background -->
  <div id="starfield" aria-hidden="true"></div>

  <!-- Top bar -->
  <header id="app-topbar" role="banner">
    <button class="topbar-logo" aria-label="AUREN home — go to start" id="topbar-home">
      AUREN
      <span>Read Between the Signs</span>
    </button>
    <button id="theme-toggle" aria-label="Toggle between Midnight and Moonlit themes">
      ☾ Midnight ↔ ☼ Moonlit
    </button>
  </header>

  <!-- Main content -->
  <main id="app-root" role="main" aria-live="polite" aria-atomic="false">
    <!-- Views are rendered here by app.js -->
  </main>

</div>

<!-- Scripts — order matters: data first, then utilities, then app -->
<script src="js/tarot-data.js"></script>
<script src="js/deck.js"></script>
<script src="js/spreads.js"></script>
<script src="js/interpretation.js"></script>
<script src="js/app.js"></script>

</body>
</html>
